name: Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            args: --win nsis
          - name: macOS
            os: macos-latest
            args: --mac dmg zip
          - name: Linux
            os: ubuntu-latest
            args: --linux AppImage
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libfuse2

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npx vite build && npx electron-builder ${{ matrix.args }} --publish never

      - name: Upload artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Hexo-Markdown-${{ matrix.name }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.AppImage
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
          retention-days: 14

  release:
    name: GitHub Release
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find dist-artifacts -type f \( \
            -name '*.exe' -o -name '*.dmg' -o -name '*.AppImage' -o \
            -name '*.zip' -o -name '*.yml' -o -name '*.yaml' -o -name '*.blockmap' \
          \) | sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No installers to publish"
            exit 1
          fi
          printf 'Publishing:\n'
          printf '  %s\n' "${files[@]}"

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            tag="${GITHUB_REF_NAME}"
            title="Hexo Markdown ${tag}"
            notes="安装包由 GitHub Actions 自动构建（${GITHUB_SHA::7}）。"
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${tag}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
              gh release edit "${tag}" --title "${title}" --notes "${notes}" --latest --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "${tag}" "${files[@]}" --title "${title}" --notes "${notes}" --latest --repo "${GITHUB_REPOSITORY}"
            fi
          else
            tag="latest"
            title="Latest build"
            notes="自动构建自 \`${GITHUB_SHA::7}\`（${GITHUB_REF_NAME}）。推送 v* 标签会生成正式版本。"
            if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
              gh release upload "${tag}" "${files[@]}" --clobber --repo "${GITHUB_REPOSITORY}"
              gh release edit "${tag}" --prerelease --title "${title}" --notes "${notes}" --repo "${GITHUB_REPOSITORY}"
            else
              gh release create "${tag}" "${files[@]}" --prerelease --title "${title}" --notes "${notes}" --latest=false --repo "${GITHUB_REPOSITORY}"
            fi
          fi
